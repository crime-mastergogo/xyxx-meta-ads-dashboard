name: Monthly Meta Ads Report

on:
  schedule:
    # 1st of every month, 9:00 AM IST = 03:30 UTC
    - cron: "30 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull full month data — statics + videos
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
        run: python main_monthly.py

      - name: Generate monthly deck
        run: python generate_monthly.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit and push
        run: |
          git config user.name "xyxx-ads-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Monthly report: $(date -u +%Y-%m)"
          git push
